name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  compiler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar sintaxis de Python
        run: python -m compileall -q compiler api tests dev_server.py
      - name: Pruebas del compilador
        run: python -m unittest discover -s tests -t . -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build de Angular
        run: npm run build